server.port=8081
spring.application.name=auth

# Configuración de Auth0
# Reemplaza con tu dominio de Auth0 (debe terminar con '/')
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://TU_DOMINIO.us.auth0.com/
# El Identificador de la API que crees en Auth0 (ej. https://consertech-api)
spring.security.oauth2.resourceserver.jwt.audiences=https://consertech-api

# Configuración de Base de Datos
spring.datasource.url=jdbc:postgresql://localhost:5432/consertech_auth
spring.datasource.username=tu_usuario_bd
spring.datasource.password=tu_password_bd
spring.jpa.hibernate.ddl-auto=update